name: Build OnePlus6 ReSukiSU Kernel


on:

  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    - name: Checkout

      uses: actions/checkout@v4



    - name: Install dependencies

      run: |

        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          flex \
          build-essential \
          ccache \
          curl \
          git \
          zip \
          python3 \
          cpio \
          device-tree-compiler \
          libssl-dev \
          libelf-dev \
          gcc-aarch64-linux-gnu \
          wget \
          zstd



    #
    # Download clang
    #

    - name: Download Neutron Clang

      run: |

        mkdir -p clang


        cd clang


        git clone \
        --depth=1 \
        -b Neutron-16 \
        https://gitlab.com/RyuujiX/neutron-clang.git .


        echo "=============================="

        echo "clang check"

        echo "=============================="


        ./bin/clang --version



    #
    # Build
    #

    - name: Build kernel

      run: |

        chmod +x build.sh


        CLANG_DIR=$GITHUB_WORKSPACE/clang \
        ./build.sh



    #
    # Build check
    #

    - name: Check kernel output

      run: |


        echo "=============================="

        echo "Checking output"

        echo "=============================="


        ls -lh kernel/out/arch/arm64/boot/


        if [ ! -f kernel/out/arch/arm64/boot/Image.gz-dtb ]

        then

          echo "Image.gz-dtb NOT FOUND"

          exit 1

        fi


        echo "Kernel build success"



    #
    # Upload
    #

    - name: Upload Kernel

      uses: actions/upload-artifact@v4


      with:


        name: OnePlus6-ReSukiSU-Image.gz-dtb


        path:

          kernel/out/arch/arm64/boot/Image.gz-dtb
