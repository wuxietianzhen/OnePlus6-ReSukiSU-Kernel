name: Build OnePlus6 ReSukiSU Kernel


on:
  workflow_dispatch:


jobs:

  build:

    runs-on: ubuntu-22.04


    steps:


    # =========================
    # 拉取源码
    # =========================

    - name: Checkout
      uses: actions/checkout@v5



    # =========================
    # 编译依赖
    # =========================

    - name: Install dependencies
      run: |

        sudo apt update

        sudo apt install -y \
          bc \
          bison \
          flex \
          build-essential \
          ccache \
          curl \
          git \
          zip \
          unzip \
          python3 \
          cpio \
          device-tree-compiler \
          libssl-dev \
          libelf-dev \
          gcc-aarch64-linux-gnu \
          wget



    # =========================
    # ccache
    # =========================

    - name: Setup ccache
      run: |

        ccache -M 5G



    # =========================
    # 下载 clang
    # =========================

    - name: Download clang
      run: |

        mkdir -p clang

        cd clang


        wget \
        https://github.com/kdrag0n/proton-clang/releases/download/20210505/proton-clang.tar.gz


        tar xf proton-clang.tar.gz


        cd ..



    # =========================
    # 编译前检查
    # =========================

    - name: Prepare build script
      run: |

        chmod +x build.sh



    # =========================
    # 编译
    # =========================

    - name: Build kernel
      run: |

        CLANG_DIR=$GITHUB_WORKSPACE/clang \
        ./build.sh



    # =========================
    # 检查生成内核
    # =========================

    - name: Verify kernel output
      run: |

        echo "===== Kernel output ====="

        ls -lh \
        kernel/out/arch/arm64/boot/Image.gz-dtb



    # =========================
    # 检查最终 config
    # =========================

    - name: Check Docker LXC support
      run: |

        echo "===== Checking kernel config ====="


        grep -E \
        "CONFIG_(UTS_NS|IPC_NS|PID_NS|NET_NS|USER_NS|MEMCG|CGROUP_DEVICE|CGROUP_NET_PRIO|VETH|SECCOMP_FILTER)" \
        kernel/out/.config || true



    # =========================
    # 检查 ReSukiSU
    # =========================

    - name: Check ReSukiSU
      run: |

        echo "===== Checking KernelSU ====="


        grep -E \
        "CONFIG_KSU|CONFIG_KSU_MANUAL_HOOK" \
        kernel/out/.config || true



    # =========================
    # 上传原始kernel
    # =========================

    - name: Upload Image.gz-dtb
      uses: actions/upload-artifact@v4

      with:

        name: OnePlus6-ReSukiSU-Image

        path:

          kernel/out/arch/arm64/boot/Image.gz-dtb



    # =========================
    # 制作 AnyKernel 刷机包
    # =========================

    - name: Build AnyKernel zip
      run: |


        cp \
        kernel/out/arch/arm64/boot/Image.gz-dtb \
        anykernel/


        cd anykernel


        zip -r \
        ../OnePlus6-ReSukiSU-Kernel.zip \
        *



    # =========================
    # 上传刷机包
    # =========================

    - name: Upload flashable zip
      uses: actions/upload-artifact@v4


      with:

        name:

          OnePlus6-ReSukiSU-flashable


        path:

          OnePlus6-ReSukiSU-Kernel.zip
